# Keeps the Supabase free-tier project awake.
#
# Free projects auto-pause after ~7 days with no activity (see the "going to be
# paused" email). This makes one tiny REST request each day, which counts as
# activity and resets the idle timer — so the project never pauses.
#
# Config lives OUT of source. Add these under
# GitHub → Settings → Secrets and variables → Actions. Either tab works — the
# workflow reads a Secret OR a Variable of the same name (the anon key is public
# by design, so a Variable is perfectly fine and easier to eyeball):
#   SUPABASE_URL        e.g. https://agrhlakrbzvdhbvkzums.supabase.co
#   SUPABASE_ANON_KEY   the anon / publishable key (sb_publishable_...)
#
# The service-role key must NEVER go here — only the public anon key.

name: Supabase keep-alive

on:
  schedule:
    # 06:17 UTC daily — a huge margin against the 7-day pause window.
    - cron: "17 6 * * *"
  workflow_dispatch: {} # run manually from the Actions tab to test

env:
  # Reads whichever you set — a Secret or a Variable (covers either tab).
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
  PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY not found. Add them under"
            echo "::error::Settings → Secrets and variables → Actions (Secrets OR Variables tab)."
            exit 1
          fi
          # A real DB *write* via the public.ping() RPC (see the keepalive migration).
          # An empty RLS-blocked read did NOT count as activity; a write (UPDATE → WAL)
          # is the strongest signal and hits both the API layer and the database.
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase responded with HTTP $code — $(cat "$body")"
          case "$code" in
            2*) echo "Heartbeat written — staying awake. ✅" ;;
            404) echo "::error::rpc/ping not found. Apply the keepalive migration (supabase/migrations/20260722000000_keepalive_heartbeat.sql)."; exit 1 ;;
            *) echo "::error::Unexpected status $code — check the URL/key."; exit 1 ;;
          esac
